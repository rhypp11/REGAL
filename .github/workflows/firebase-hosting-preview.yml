name: Firebase Hosting Preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate JavaScript syntax
        run: |
          node --check jtd-data.js
          node --check app.js
          node --check firebase.js
          node --check theme.js
          node --check lifecycle.js
          node --check cemetery.js
          node --check cemetery-import.js
          node --check dialogs.js
          node --check journal.js
          node --check journal-data.js
          node --test tests/data.test.cjs
          node --test tests/journal-data.test.cjs

      - name: Check themes on desktop and mobile in local sandbox
        run: |
          npm install --prefix "$RUNNER_TEMP/jtd-browser" --no-package-lock playwright@1.58.2
          python3 -m http.server 8765 > "$RUNNER_TEMP/theme-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" node tests/theme-smoke.cjs

      - name: Check order and receipt flows
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/workflow.cjs

      - name: Check private journal, collection links and storage rollback
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/journal.cjs

      - name: Check cemetery flows
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/cemetery.cjs

      - name: Check additive cemetery imports
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/cemetery-import.cjs

      - name: Check collection cards on mobile
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/collection-layout.cjs

      - name: Check editing modal actions on mobile and desktop
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/modal-actions.cjs

      - name: Check whole and cropped game images and persistence
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/image-modes.cjs

      - name: Check game form layout, optional fields and long content
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/modal-form-layout.cjs

      - name: Check dialog keyboard accessibility and cancellation
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/dialog-keyboard.cjs

      - name: Check shared page controls and keyboard filters
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/global-ui.cjs

      - name: Check long lists and empty collection transitions
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/edge-cases.cjs

      - name: Compare pages and forms with the base branch
        run: |
          mkdir -p "$RUNNER_TEMP/jtd-baseline"
          for file in index.html styles.css cemetery.css cemetery-import.css ui-foundations.css home-boards-v2.css collection.css; do
            git show '${{ github.event.pull_request.base.sha }}:'"$file" > "$RUNNER_TEMP/jtd-baseline/$file"
          done
          NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" JTD_BASELINE_CSS="$RUNNER_TEMP/jtd-baseline/styles.css" JTD_BASELINE_DIR="$RUNNER_TEMP/jtd-baseline" node tests/css-regression.cjs

      - name: Save theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jtd-theme-screenshots
          path: |
            /tmp/jtd-*.png
            /tmp/jtd-css-differences-*.json
          retention-days: 7

      - name: Test sandbox data flows on mobile and desktop
        run: |
          NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/browser.cjs


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare isolated Firebase preview site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JEUX_TOUT_DOUX }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@15.32.0 hosting:sites:get jtd-sandbox-rhypp11 --project jeux-tout-doux --json >/dev/null 2>&1 ||             npx --yes firebase-tools@15.32.0 hosting:sites:create jtd-sandbox-rhypp11 --project jeux-tout-doux
          npx --yes firebase-tools@15.32.0 target:apply hosting pr-preview jtd-sandbox-rhypp11 --project jeux-tout-doux

      - name: Validate Firestore rules in emulator
        run: |
          npx --yes firebase-tools@15.32.0 emulators:exec --only firestore --project demo-jeux-tout-doux "echo Firestore rules compiled"

      - name: Deploy isolated preview site
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx --yes firebase-tools@15.32.0 hosting:channel:deploy pr-${{ github.event.pull_request.number }} --only pr-preview --expires 7d --project jeux-tout-doux --non-interactive --json > "$RUNNER_TEMP/preview-deploy.json"
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/preview-deploy.json', 'utf8'));
          function findUrl(value) {
            if (!value || typeof value !== 'object') return null;
            if (typeof value.url === 'string' && /^https:\/\/jtd-sandbox-rhypp11--.*\.web\.app$/.test(value.url)) return value.url;
            for (const child of Object.values(value)) { const url = findUrl(child); if (url) return url; }
            return null;
          }
          const url = findUrl(result);
          if (!url) throw new Error('Missing sandbox channel URL');
          console.log('url=' + url);
          NODE

      - name: Smoke test deployed sandbox
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PREVIEW_URL/" > /tmp/preview.html
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PREVIEW_URL/app.js" > /tmp/app.js
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PREVIEW_URL/firebase.js" > /tmp/firebase.js
          grep -q '<title>JTD' /tmp/preview.html
          grep -q "jtd-sandbox-rhypp11.web.app" /tmp/preview.html
          grep -q "const IS_PREVIEW_MODE = window.JTD_PREVIEW_MODE === true" /tmp/app.js
          grep -q "const fbApp = previewMode ? null : initializeApp(firebaseConfig)" /tmp/firebase.js
          google-chrome --headless --disable-gpu --no-sandbox --virtual-time-budget=5000 --dump-dom "$PREVIEW_URL/" > /tmp/rendered.html 2> /tmp/chrome.log
          grep -Eq 'class="auth-loading hidden"[^>]*id="auth-loading"|id="auth-loading"[^>]*class="auth-loading hidden"' /tmp/rendered.html || {
            echo "Rendered sandbox did not leave loading state"
            cat /tmp/chrome.log
            grep -n "auth-loading" /tmp/rendered.html || true
            exit 1
          }
          echo "Sandbox preview verified: ${PREVIEW_URL}"

      - name: Preview summary
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Sandbox preview (7 days) — $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
