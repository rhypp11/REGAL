name: Firebase Hosting Preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate JavaScript syntax
        run: |
          node scripts/build-release.cjs --check
          node --test tests/release.test.cjs
          node --check pokedex.js
          node --check jtd-data.js
          node --check app.js
          node --check digital.js
          node --check deku-data.js
          node --check deku-import.js
          node --test tests/deku-data.test.cjs
          node --check firebase.js
          node --check lifecycle.js
          node --check cemetery.js
          node --check cemetery-import.js
          node --check dialogs.js
          node --test tests/data.test.cjs
          node --test tests/digital-data.test.cjs
          node --test tests/import-export.test.cjs

      - name: Check dark mode on desktop and mobile in local sandbox
        run: |
          npm install --prefix "$RUNNER_TEMP/jtd-browser" --no-package-lock playwright@1.58.2
          NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/theme-smoke.cjs

      - name: Check order and receipt flows
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/workflow.cjs

      - name: Check collection summary and list navigation
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/home-navigation.cjs


      - name: Check partial release dates
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/partial-dates.cjs

      - name: Check Journal drag and drop
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/journal-drag.cjs

      - name: Check cemetery flows
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/cemetery.cjs

      - name: Check additive cemetery imports
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/cemetery-import.cjs

      - name: Check import decisions, restoration guards and ChatGPT exports
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/import-export.cjs

      - name: Check collection cards on mobile
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/collection-layout.cjs

      - name: Check console purchases, DLC grouping and accounts
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/digital.cjs

      - name: Check DLC statuses and illustrated parent search
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/dlc-links.cjs

      - name: Check DLC filter counts and account list
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/collection-filters.cjs

      - name: Check Deku Deals review and additive imports
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/deku-import.cjs

      - name: Check editing modal actions on mobile and desktop
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/modal-actions.cjs

      - name: Check whole and cropped game images and persistence
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/image-modes.cjs

      - name: Check game form layout, optional fields and long content
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/modal-form-layout.cjs

      - name: Check dialog keyboard accessibility and cancellation
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/dialog-keyboard.cjs

      - name: Check shared page controls and keyboard filters
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/global-ui.cjs

      - name: Check long lists and empty collection transitions
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/edge-cases.cjs

      # The approved identity intentionally changes colors and surfaces.
      # Keep the old exact-CSS comparator for future no-render-change cleanups.
      - name: Check REGAL identity on every page and dialog
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/regal-identity.cjs

      - name: Check semantic month, category and status colors
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/semantic-colors.cjs

      - name: Check manual entry and explicit module transfers
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/manual-add.cjs

      - name: Check interactive Pokedex prototype
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/pokedex.cjs
      - name: Check private Pokedex account integration with local Firebase stubs
        run: NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/pokedex-account.cjs
      - name: Save theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jtd-theme-screenshots
          path: |
            /tmp/jtd-*.png
            /tmp/jtd-css-differences-*.json
          retention-days: 7

      - name: Test sandbox data flows on mobile and desktop
        run: |
          NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node tests/browser.cjs


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare isolated Firebase preview site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JEUX_TOUT_DOUX }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@15.32.0 hosting:sites:get jtd-sandbox-rhypp11 --project jeux-tout-doux --json >/dev/null 2>&1 ||             npx --yes firebase-tools@15.32.0 hosting:sites:create jtd-sandbox-rhypp11 --project jeux-tout-doux
          npx --yes firebase-tools@15.32.0 target:apply hosting pr-preview jtd-sandbox-rhypp11 --project jeux-tout-doux

      - name: Validate Firestore rules in emulator
        run: |
          npx --yes firebase-tools@15.32.0 emulators:exec --only firestore --project demo-jeux-tout-doux "echo Firestore rules compiled"

      - name: Deploy isolated preview site
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          deploy_channel() {
            npx --yes firebase-tools@15.32.0 hosting:channel:deploy "$1" --only pr-preview --expires 7d --project jeux-tout-doux --non-interactive --json > "$RUNNER_TEMP/preview-deploy.json" || return
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/preview-deploy.json', 'utf8'));
          function findUrl(value) {
            if (!value || typeof value !== 'object') return null;
            if (typeof value.url === 'string' && /^https:\/\/jtd-sandbox-rhypp11--.*\.web\.app$/.test(value.url)) return value.url;
            for (const child of Object.values(value)) { const url = findUrl(child); if (url) return url; }
            return null;
          }
          const url = findUrl(result);
          if (!url) throw new Error('Missing sandbox channel URL');
          console.log(url);
          NODE
          }
          channel="pr-${{ github.event.pull_request.number }}"
          url="$(deploy_channel "$channel")"
          if ! curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 "$url/" -o /dev/null; then
            echo "The original sandbox channel did not serve the site. Deploying to a fresh sandbox channel."
            url="$(deploy_channel "$channel-${{ github.run_number }}-${{ github.run_attempt }}")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed sandbox
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Checking sandbox entry point"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$PREVIEW_URL/" > /tmp/preview.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$PREVIEW_URL/app.js" > /tmp/app.js
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$PREVIEW_URL/firebase.js" > /tmp/firebase.js
          grep -q '<title>REGAL' /tmp/preview.html
          grep -q "jtd-sandbox-rhypp11.web.app" /tmp/preview.html
          grep -q "const IS_PREVIEW_MODE = window.JTD_PREVIEW_MODE === true" /tmp/app.js
          grep -q "const fbApp = previewMode ? null : initializeApp(firebaseConfig)" /tmp/firebase.js
          NODE_PATH="$RUNNER_TEMP/jtd-browser/node_modules" JTD_CHROME="$(command -v google-chrome)" node - <<'NODE'
          const assert = require('node:assert/strict');
          const {chromium} = require('playwright');
          (async () => {
            const url = new URL(process.env.PREVIEW_URL);
            assert.match(url.hostname, /^jtd-sandbox-rhypp11--.+\.web\.app$/);
            const browser = await chromium.launch({executablePath:process.env.JTD_CHROME});
            try {
              const context = await browser.newContext({serviceWorkers:'block'});
              const unexpected = [];
              await context.route('**/*', route => {
                const request = new URL(route.request().url());
                if(request.origin === url.origin && request.pathname !== '/firebase.js') return route.continue();
                if(!['fonts.googleapis.com','fonts.gstatic.com'].includes(request.hostname)) unexpected.push(request.hostname + request.pathname);
                return route.abort();
              });
              const page = await context.newPage();
              await page.goto(url.href);
              await page.locator('#app-shell').waitFor({state:'visible'});
              assert.equal(await page.locator('html').getAttribute('data-environment'),'sandbox');
              assert.equal(await page.locator('#login-gate').isVisible(),false);
              assert.equal(await page.locator('script[src*="firebase.js"]').count(),0);
              assert.deepEqual(unexpected,[]);
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          echo "Sandbox preview verified: ${PREVIEW_URL}"

      - name: Preview summary
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Sandbox preview (7 days) — $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"



